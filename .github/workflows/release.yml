name: Release

# Triggered only by pushing a version tag such as v0.2.0. Verifies the tag
# against project.yml, runs the metadata and unit checks, packages a Release
# DMG with a SHA-256 file, and creates a DRAFT GitHub release in this repo.
# Nothing here writes to any other repository.
#
# Wrapper-only release: the upstream `cswap` CLI is NOT bundled.
#
# ── Secrets (all OPTIONAL) ───────────────────────────────────────────────
# With no signing secrets the job still runs and produces an UNSIGNED,
# NOT NOTARIZED DMG. The draft release is then marked as a prerelease with an
# "unsigned experimental build" note.
#
#   CODESIGN_IDENTITY              Developer ID Application identity string
#   CODESIGN_CERT_P12_BASE64       base64 of the Developer ID .p12
#   CODESIGN_CERT_PASSWORD         password for the .p12
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD
#                                  notarization (only used when all are set
#                                  together with CODESIGN_IDENTITY)
#
# TODO: pin to reviewed commit SHAs before public release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate tag, test, package DMG
    runs-on: macos-15
    env:
      TAG: ${{ github.ref_name }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      CODESIGN_CERT_P12_BASE64: ${{ secrets.CODESIGN_CERT_P12_BASE64 }}
      CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format and match project.yml version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must look like v<major>.<minor>.<patch>"
            exit 1
          fi
          source ./scripts/lib/common.sh
          VERSION="$(cs_project_setting MARKETING_VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::MARKETING_VERSION not found in project.yml"
            exit 1
          fi
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match project.yml MARKETING_VERSION (expected v$VERSION)"
            exit 1
          fi
          echo "Tag $TAG matches project.yml version $VERSION"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Verify metadata (incl. xcodegen drift check)
        run: ./scripts/verify-metadata.sh --check-xcodegen

      - name: Unit tests (Debug, unsigned)
        run: ./scripts/build-app.sh --config Debug --action test

      - name: Import signing certificate (skipped if no signing identity)
        if: ${{ env.CODESIGN_IDENTITY != '' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CODESIGN_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CODESIGN_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | sed 's/"//g')"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notary credentials (skipped unless fully configured)
        if: ${{ env.CODESIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          xcrun notarytool store-credentials "claude-swap-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$RUNNER_TEMP/release-signing.keychain-db"
          echo "NOTARY_PROFILE=claude-swap-notary" >> "$GITHUB_ENV"

      - name: Package DMG (signed only if configured, notarized only if configured)
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          ARGS=()
          if [[ -n "${NOTARY_PROFILE:-}" ]]; then
            ARGS+=(--notarize)
          fi
          ./scripts/package-release.sh ${ARGS[@]+"${ARGS[@]}"}

      - name: Check that exactly one DMG and one checksum exist
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          sums=(dist/*.dmg.sha256)
          if [[ ${#dmgs[@]} -ne 1 || ${#sums[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one DMG and one .sha256 in dist/ (found ${#dmgs[@]} and ${#sums[@]})"
            exit 1
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  publish:
    name: Create draft GitHub release
    needs: package
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Check artifacts and build release notes
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          sums=(dist/*.dmg.sha256)
          if [[ ${#dmgs[@]} -ne 1 || ${#sums[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one DMG and one .sha256 in dist/ (found ${#dmgs[@]} and ${#sums[@]})"
            exit 1
          fi

          NOTES="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' 'Claude Swap for macOS is a native companion for [claude-swap](https://github.com/realiti4/claude-swap) by realiti4. Account management is powered by the separately installed upstream `cswap` CLI, which is not bundled. This wrapper is maintained independently and is not an official upstream or Anthropic app.' > "$NOTES"

          PRERELEASE_FLAG=""
          case "${dmgs[0]}" in
            *-unsigned.dmg)
              PRERELEASE_FLAG="--prerelease"
              printf '\n%s\n' '> **Unsigned experimental build.** This DMG is not signed and not notarized. macOS will warn on first launch. Verify the SHA-256 checksum before opening it.' >> "$NOTES"
              ;;
          esac
          echo "PRERELEASE_FLAG=$PRERELEASE_FLAG" >> "$GITHUB_ENV"
          echo "DMG_FILE=${dmgs[0]}" >> "$GITHUB_ENV"
          echo "SHA_FILE=${sums[0]}" >> "$GITHUB_ENV"
          echo "NOTES_FILE=$NOTES" >> "$GITHUB_ENV"

      - name: Create draft release
        run: |
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --repo "$REPO" \
            --draft \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG \
            "$DMG_FILE" "$SHA_FILE"
