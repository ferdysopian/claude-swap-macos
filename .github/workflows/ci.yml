name: CI

# Runs on pushes to main and on every PR. Uses NO secrets: builds are
# unsigned by design (see scripts/build-app.sh and scripts/package-release.sh).
# Safe to run on forked-repo PRs.
#
# TODO: pin to reviewed commit SHAs before public release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No secrets consulted anywhere in this workflow.
  CI: "true"

jobs:
  metadata:
    name: Verify release metadata
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Verify metadata (incl. xcodegen drift check)
        run: ./scripts/verify-metadata.sh --check-xcodegen

  build-test:
    name: Build & test ClaudeSwap (unsigned)
    runs-on: macos-15
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Build (Debug, unsigned)
        run: ./scripts/build-app.sh --config Debug --action build

      - name: Test (Debug, unsigned, unit tests only)
        run: ./scripts/build-app.sh --config Debug --action test

  shell-lint:
    name: Shellcheck scripts/**
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Shellcheck
        # Run from scripts/ so `# shellcheck source=lib/common.sh` directives
        # (relative to the checked file) resolve correctly.
        run: |
          cd scripts
          shellcheck -x ./*.sh ./lib/*.sh
